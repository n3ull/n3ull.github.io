<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cog</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .wrap {
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
    }

    .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #101010;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #555;
    }

    .search-container { width: 100%; position: relative; }

    #searchInput {
        width: 100%;
        background: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 18px 50px 18px 22px;
        font-size: 17px;
        color: #000000;
        outline: none;
    }

    #searchInput::placeholder { color: #888; }

    .search-icon {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        color: #999;
        pointer-events: none;
    }

    .engines {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .engine {
        background: #111;
        border: 1px solid #222;
        color: #888;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        padding: 8px 16px;
        border-radius: 20px;
        transition: all 0.15s ease;
    }

    .engine:hover { color: #fff; border-color: #444; }

    .engine.active {
        color: #000;
        background: #fff;
        border-color: #fff;
    }

    .hint {
        font-size: 11px;
        color: #444;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .notice {
        font-size: 12px;
        color: #555;
        text-align: center;
        line-height: 1.6;
        max-width: 420px;
    }

    .history {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .history-title {
        font-size: 10px;
        color: #444;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 4px;
    }

    .history-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #0c0c0c;
        border: 1px solid #1a1a1a;
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 14px;
        color: #999;
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .history-item:hover {
        background: #151515;
        color: #fff;
    }

    .history-item span.engine-tag {
        font-size: 10px;
        color: #444;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .clear-history {
        align-self: center;
        background: none;
        border: none;
        color: #333;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        margin-top: 6px;
    }

    .clear-history:hover { color: #888; }
</style>
</head>
<body>
<div class="wrap">
    <div class="icon">C</div>
    <h1>Cog</h1>

    <div class="search-container">
        <input
            type="text"
            id="searchInput"
            placeholder="Search incognito..."
            autocomplete="off"
            spellcheck="false"
            autofocus
        >
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
    </div>

    <div class="engines">
        <button class="engine active" data-engine="duckduckgo">DuckDuckGo</button>
        <button class="engine" data-engine="brave">Brave</button>
        <button class="engine" data-engine="swisscows">SwissCows</button>
        <button class="engine" data-engine="startpage">Startpage</button>
    </div>

    <div class="hint">Press Enter to search &middot; opens in a new tab</div>

    <div class="notice">
        Results open in a new tab instead of embedding here, because search engines
        block being loaded inside another site's page (this is enforced on their end
        and can't be bypassed). This keeps your search private and the connection direct.
    </div>

    <div class="history" id="historyBlock" style="display:none;">
        <div class="history-title">Recent</div>
        <div id="historyList"></div>
        <button class="clear-history" id="clearHistory">Clear history</button>
    </div>
</div>

<script>
    let currentEngine = 'duckduckgo';
    let history = [];

    const engines = {
        duckduckgo: { url: 'https://duckduckgo.com/?q=', label: 'DuckDuckGo' },
        brave:      { url: 'https://search.brave.com/search?q=', label: 'Brave' },
        swisscows:  { url: 'https://swisscows.com/web?query=', label: 'SwissCows' },
        startpage:  { url: 'https://www.startpage.com/sp/search?query=', label: 'Startpage' }
    };

    const input = document.getElementById('searchInput');
    const engineButtons = document.querySelectorAll('.engine');
    const historyBlock = document.getElementById('historyBlock');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistory');

    engineButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            currentEngine = btn.dataset.engine;
            engineButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            input.focus();
        });
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const query = input.value.trim();
            if (query) performSearch(query);
        }
        if (e.key === 'Escape') {
            input.value = '';
        }
    });

    function performSearch(query) {
        const engine = engines[currentEngine];
        const url = engine.url + encodeURIComponent(query);

        // Open in a new tab -- search engines block iframe embedding via
        // X-Frame-Options / CSP, so this is the only reliable way to show results.
        window.open(url, '_blank', 'noopener,noreferrer');

        addToHistory(query, engine.label);
        input.value = '';
    }

    function addToHistory(query, engineLabel) {
        history.unshift({ query, engineLabel });
        history = history.slice(0, 8);
        renderHistory();
    }

    function renderHistory() {
        if (history.length === 0) {
            historyBlock.style.display = 'none';
            return;
        }
        historyBlock.style.display = 'flex';
        historyList.innerHTML = '';
        history.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<span>${escapeHtml(item.query)}</span><span class="engine-tag">${item.engineLabel}</span>`;
            div.addEventListener('click', () => {
                input.value = item.query;
                performSearch(item.query);
            });
            historyList.appendChild(div);
        });
    }

    clearHistoryBtn.addEventListener('click', () => {
        history = [];
        renderHistory();
    });

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    input.focus();
</script>
</body>
</html>
